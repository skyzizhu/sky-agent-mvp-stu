<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Agent 研究工作台</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --line:#e3e6ec; --txt:#1c2333;
          --dim:#69718a; --acc:#2563eb; --ok:#188554; --err:#c93c37;
          --warn:#9a6700; --input:#f2f4f8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.6 -apple-system,"PingFang SC",sans-serif; }
  header { padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:14px; }
  h1 { font-size:16px; margin:0; }
  .gauge { margin-left:auto; font-size:12px; color:var(--dim); }
  .gauge .track { display:inline-block; width:120px; height:8px; background:var(--input);
                  border-radius:99px; overflow:hidden; vertical-align:middle; margin:0 6px; }
  .gauge .fill { display:block; height:100%; background:var(--acc); width:0%; transition:width .4s; }
  main { display:grid; grid-template-columns:250px 1fr; gap:14px; padding:14px 20px; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  h2 { font-size:12px; color:var(--dim); margin:0 0 8px; text-transform:uppercase; letter-spacing:.4px; }
  .run-item { font-size:12px; padding:7px 9px; border:1px solid var(--line); border-radius:7px;
              margin-bottom:6px; cursor:pointer; }
  .run-item:hover { border-color:var(--acc); }
  .run-item.selrun { border-color:var(--acc); background:#f0f6ff; }
  .run-item .st { float:right; }
  textarea { width:100%; min-height:64px; background:var(--input); color:var(--txt);
             border:1px solid var(--line); border-radius:8px; padding:9px;
             font:13px/1.5 inherit; resize:vertical; }
  .btnrow { display:flex; gap:8px; margin:10px 0 4px; }
  button { border:none; border-radius:7px; padding:8px 16px; cursor:pointer;
           font-size:13px; color:#fff; background:var(--acc); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:#fff; color:var(--err); border:1px solid var(--line); }
  #timeline { margin-top:6px; }
  .ev { border:1px solid var(--line); border-left:3px solid var(--acc); border-radius:8px;
        padding:7px 11px; margin:7px 0; font-size:12.5px; background:#fbfcfe; }
  .ev .tt { color:var(--dim); font-size:11px; margin-right:8px; }
  .ev.tool { border-left-color:#188554; }
  .ev.compact { border-left-color:#9a6700; background:#fffaf0; }
  .ev.budget { border-left-color:#9a6700; background:#fffaf0; }
  .ev.approval { border-left-color:#c93c37; background:#fdf1f0; }
  .ev.final { border-left-color:#188554; background:#f2faf5; }
  .approval .btns { margin-top:6px; display:flex; gap:8px; }
  .approval .yes { background:var(--ok); }
  .approval .no { background:var(--err); }
  .report { background:#fbfbfc; border:1px solid var(--line); border-radius:8px;
            padding:12px; font-size:13.5px; max-height:60vh;
            overflow:auto; margin-top:8px; }
  .report.md { white-space:normal; }   /* md渲染后是HTML，pre-wrap会产生多余空行 */
  .placeholder { color:var(--dim); font-size:12px; text-align:center; padding:30px 0; }
  .md h1, .md h2, .md h3 { margin:.6em 0 .35em; line-height:1.35; }
  .md h1 { font-size:17px; } .md h2 { font-size:15.5px; } .md h3 { font-size:14px; }
  .md p { margin:.45em 0; }
  .md table { border-collapse:collapse; margin:.5em 0; width:100%; font-size:12.5px; }
  .md th, .md td { border:1px solid var(--line); padding:5px 9px; text-align:left; }
  .md th { background:var(--input); }
  .md code { background:var(--input); border-radius:4px; padding:1px 5px;
             font:12px ui-monospace,Monaco,monospace; }
  .md pre { background:var(--input); border-radius:6px; padding:9px; overflow:auto; }
  .md pre code { background:none; padding:0; }
  .md a { color:var(--acc); }
  .md ul, .md ol { margin:.4em 0; padding-left:1.4em; }
  .md blockquote { border-left:3px solid var(--line); margin:.5em 0; padding:2px 12px;
                   color:var(--dim); }
  .hint { font-size:11px; color:var(--dim); margin-top:6px; }
  button.tier { background:#fff; color:var(--dim); border:1px solid var(--line);
                padding:5px 12px; font-size:12px; border-radius:99px; }
  button.tier.sel { background:var(--acc); color:#fff; border-color:var(--acc); }
  details.ev { cursor:pointer; }
  details.ev summary { list-style:none; }
  details.ev summary::-webkit-details-marker { display:none; }
  details.ev summary::after { content:" ▸ 展开详情"; color:var(--acc); font-size:11px; }
  details.ev[open] summary::after { content:" ▴ 收起"; }
  details .dx { margin-top:7px; border-top:1px dashed var(--line); padding-top:7px;
                font-size:11.5px; color:#414a60; }
  details .dx b { color:var(--dim); }
  details .dx pre { background:var(--input); border-radius:6px; padding:6px 8px;
                    margin:4px 0; white-space:pre-wrap; word-break:break-all;
                    font:11px/1.5 ui-monospace,Monaco,monospace; max-height:220px; overflow:auto; }
  ul.subs { list-style:none; margin:8px 0 0; padding:0; }
  ul.subs > li { padding:6px 9px; border-bottom:1px dashed var(--line); font-size:12.5px; }
  ul.subs > li:last-child { border-bottom:none; }
  ul.subs .sub { color:var(--acc); font-family:ui-monospace,Monaco,monospace;
                 font-weight:700; margin-right:7px; }
  ul.subs details { margin-top:5px; }
  ul.subs details summary { color:var(--acc); font-size:11px; cursor:pointer; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<header>
  <h1>🔬 Agent 研究工作台</h1>
  <span style="color:var(--dim);font-size:12px" id="model"></span>
  <div class="gauge">预算 <span id="budget_text">-</span>
    <span class="track"><span class="fill" id="budget_fill"></span></span>
  </div>
</header>

<main>
  <!-- 左：运行历史 -->
  <div class="panel">
    <h2>运行历史</h2>
    <div id="history"><div class="placeholder">暂无运行</div></div>
  </div>

  <!-- 右：工作区 -->
  <div>
    <div class="panel">
      <div class="btnrow" style="margin:0 0 8px" id="tiers">
        <button class="tier" data-t="quick">⚡ 快问 · 2万 tok</button>
        <button class="tier sel" data-t="standard">📊 标准 · 5万 tok</button>
        <button class="tier" data-t="deep">🔍 深度 · 12万 tok</button>
        <button class="tier" data-t="unlimited">🚀 深度+ · 不限额度</button>
      </div>
      <textarea id="question" placeholder="输入研究问题，如：对比 Coze 和 Dify 的收费模式"></textarea>
      <div class="btnrow">
        <button id="start" onclick="start()">🚀 开始研究</button>
        <button id="stopbtn" class="ghost" onclick="stopRun()" disabled>⏹ 中止</button>
      </div>
      <div class="hint">含"把报告发给某人邮箱"的问题会触发危险操作确认；写类工具同样需要批准。</div>
    </div>

    <div class="panel" style="margin-top:14px">
      <h2>执行流（实时）</h2>
      <div id="timeline"><div class="placeholder">等待运行…</div></div>
      <div class="approval" id="approval" style="display:none">
        <div class="ev approval">
          <b>⚠️ 需要人工确认</b> —— <span id="approval_text"></span>
          <div class="btns">
            <button class="yes" onclick="respond(true)">✅ 批准执行</button>
            <button class="no" onclick="respond(false)">❌ 拒绝</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-top:14px;display:none" id="report_panel">
      <h2>最终报告</h2>
      <div class="report md" id="report"></div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let runId = null, es = null, liveMode = false;
let curGroup = null, lastApprovalLi = null;
let TIERS = {quick:10000, standard:30000, deep:100000};
const esc = t => String(t ?? '').replace(/</g,'&lt;');
const msBadge = ms => ms != null ? ` <span class="tt">⏱ ${ms}ms</span>` : '';

fetch('/api/config').then(r=>r.json()).then(c=>{
  $('model').textContent = '模型: ' + c.model;
  if (c.tiers) TIERS = c.tiers;
  $('budget_text').textContent = Number(TIERS.standard).toLocaleString() + ' tok';
  document.querySelectorAll('#tiers .tier').forEach(b => {
    if (TIERS[b.dataset.t]) b.textContent =
      b.textContent.replace(/· .*$/, '· ' + Number(TIERS[b.dataset.t]).toLocaleString() + ' tok');
  });
});

// 档位选择：点选切换 + 同步预算仪表
let tier = 'standard';
document.querySelectorAll('#tiers .tier').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#tiers .tier').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    tier = b.dataset.t;
    $('budget_text').textContent = TIERS[tier]
      ? Number(TIERS[tier]).toLocaleString() + ' tok'
      : '不限额度（步数上限仍生效）';
    $('budget_fill').style.width = '0%';
  };
});

function loadHistory(){
  fetch('/api/runs').then(r=>r.json()).then(d=>{
    if (!d.runs.length) { $('history').innerHTML = '<div class="placeholder">暂无运行</div>'; return; }
    $('history').innerHTML = d.runs.slice(0,15).map(r=>`
      <div class="run-item ${r.run_id===runId?'selrun':''}" data-rid="${r.run_id}"
           onclick="loadRun('${r.run_id}')" title="${(r.question||'').replace(/"/g,'')}">
        <span class="st" style="color:${r.stop_reason==='model_done'?'#188554':'#9a6700'}">
          ${r.stop_reason==='model_done'?'✓':'⏹'}</span>
        ${(r.question||'').slice(0,26)}…<br>
        <span style="color:var(--dim)">${r.ts.slice(5,16)} · ${(r.tokens||0).toLocaleString()} tok</span>
      </div>`).join('');
  });
}
loadHistory();   // 页面加载即填充历史列表（此前漏调用：函数在但从不执行）

// ---------- 渲染基础设施 ----------
function resetTimeline(){
  $('timeline').innerHTML = '';
  curGroup = null; lastApprovalLi = null;
  $('approval').style.display = 'none';
}
function ensureGroup(n, title){
  if (curGroup && curGroup.n === String(n)) return curGroup.ul;
  const d = document.createElement('details');   // 默认折叠：点击标题展开
  d.className = 'ev';
  d.innerHTML = `<summary><b>${title}</b></summary><ul class="subs"></ul>`;
  $('timeline').appendChild(d);
  curGroup = {n: String(n), ul: d.querySelector('ul')};
  return curGroup.ul;
}
function addSub(sub, html, detailsHtml){
  const ul = ensureGroup(sub.split('.')[0],
    sub.split('.')[0] === '0' ? '第 0 步 · 启动准备' : `第 ${sub.split('.')[0]} 步`);
  const li = document.createElement('li');
  li.dataset.sub = sub;
  li.innerHTML = `<span class="sub">${sub}</span>` + html;
  if (detailsHtml) {
    const d = document.createElement('details');
    d.innerHTML = `<summary>展开详情</summary><div class="dx">${detailsHtml}</div>`;
    li.appendChild(d);
  }
  ul.appendChild(li);
  li.scrollIntoView({block:'nearest'});
  return li;
}
function addStandalone(cls, html, detailsHtml){
  const div = document.createElement('div');
  if (detailsHtml) {   // 带详单 → 渲染为可展开卡片（与 addSub 同构）
    div.className = 'ev ' + cls;
    div.innerHTML = `<summary>${html}</summary><div class="dx">${detailsHtml}</div>`;
    const d = document.createElement('details');
    d.className = div.className; d.innerHTML = div.innerHTML;
    $('timeline').appendChild(d);
    d.scrollIntoView({block:'nearest'});
    return d;
  }
  div.className = 'ev ' + cls; div.innerHTML = html;
  $('timeline').appendChild(div);
  div.scrollIntoView({block:'nearest'});
  return div;
}
// ---------- 统一渲染器：实时 SSE 与历史回放共用 ----------
function renderEvent(ev, live){
  const sub = ev.sub;
  switch(ev.type){

    case 'memory_inject':
      addSub(sub, `🧠 载入 <b>${ev.count}</b> 条长期偏好`,
        ev.text ? `<pre>${esc(ev.text)}</pre>` : ''); break;
    case 'guardrail':
      addSub(sub, `🛡️ 预算 <b>${Number(ev.max).toLocaleString()}</b> tok`); break;
    case 'mcp':
      addSub(sub, `🔌 ${esc(ev.msg)}`); break;

    case 'step': {
      ensureGroup(ev.step, `第 ${ev.step} 步`);
      const d = ev.detail || {};
      const td = d.token_detail || {};
      const mi = d.model_input || [];
      const mo = d.model_output || {};
      addSub(sub,
        `🧠 模型调用 → ` +
        (ev.tools.length ? `工具调用 <b>${ev.tools.join('、')}</b>` : '✍️ 撰写最终报告') +
        msBadge(ev.model_ms),
        `<b>① 给到模型的完整输入（messages 全量，零删减，共 ${ev.total_messages} 条）</b>` +
        `<pre>${esc(JSON.stringify(mi, null, 1))}</pre>` +
        `<b>② 模型的完整输出（全字段，key 和 value 一个不落）</b>：` +
        `<pre>${esc(JSON.stringify(mo, null, 1))}</pre>` +
        `<b>③ token明细</b>：输入 ${td.prompt ?? '?'} / 输出 ${td.completion ?? '?'} / ` +
        `思考 ${td.reasoning ?? 0} / 缓存命中 ${td.cached ?? 0}`);
      if (TIERS[tier] != null) {
        $('budget_fill').style.width =
          Math.min(100, Math.round(ev.prompt_tokens / TIERS[tier] * 100)) + '%';
      }
      break;
    }

    case 'inject':
      addSub(sub, `⚠️ ${esc(ev.note)}`); break;
    case 'progress':
      addSub(sub, `📊 ${esc(ev.text)}`); break;
    case 'budget':
      addSub(sub, `⚠️ ${esc(ev.note || '预算接近上限，注入收尾指令')}（${ev.used}/${ev.max}）`); break;
    case 'breaker':
      addSub(sub, `🚨 ${esc(ev.note)}（${ev.used}/${ev.max} tok）`); break;

    case 'compact': {
      const st = ev.stats || {};
      addSub(sub,
        `★ 上下文压缩：${ev.before} → ${ev.after} 字符`,
        `<b>压缩目的</b>：对抗 context rot 与 token 成本——上下文越长，模型对早期信息的召回越差，` +
        `且每轮都为全部历史付全价。事实已由笔记兜底，旧历史可以放心摘要化。<br>` +
        `<b>压缩方法</b>：${esc(st.method || 'LLM摘要 + 最近原文保留')}。把 ${st.old_messages??'?'} 条旧消息` +
        `（含旧工具结果）压缩成保留四类信息的摘要（任务目标/关键发现/未完成事项/约束条件），` +
        `重建为 [system + 摘要 + 最近 ${st.kept_recent??'?'} 条原文]。<br>` +
        `<b>压缩效果</b>：摘要 ${st.summary_chars??'?'} 字符替代 ${st.old_messages??'?'} 条消息；` +
        `总长度 ${st.total_before??'?'} → ${st.total_after??'?'} 字符。<br>` +
        `<b>④ 压缩调用的完整输入（交给摘要模型的旧历史全文）</b>：<pre>${esc(ev.summarizer_input || '（本次运行未记录，早于该功能）')}</pre>` +
        `<b>⑤ 压缩调用的完整输出（摘要全文）</b>：<pre>${esc(ev.summary)}</pre>`);
      break;
    }

    case 'tool_result':
      addSub(sub,
        `🔧 ${ev.name} → ${String(ev.result).slice(0,110)}` + msBadge(ev.tool_ms),
        `<b>输入参数</b>：<pre>${esc(JSON.stringify(ev.args, null, 1))}</pre>` +
        `<b>完整输出（前4000字符）</b>：<pre>${esc(ev.full_result || ev.result)}</pre>`);
      break;

    case 'approval_request':
      $('approval').style.display = live ? '' : 'none';
      $('approval_text').textContent = `${ev.tool}(${ev.args.slice(0,80)}) —— ${ev.reason}`;
      lastApprovalLi = addSub(sub,
        live ? `⚠️ <b>等待人工确认</b>：${ev.tool}`
             : `⚠️ 人工确认：${ev.tool}`, '', 'approval');
      break;
    case 'approval_result':
      $('approval').style.display = 'none';
      if (lastApprovalLi && lastApprovalLi.dataset.sub === sub) {
        lastApprovalLi.innerHTML +=
          ` <b style="color:${ev.approved?'#188554':'#c93c37'}">→ ${ev.approved?'✅ 已批准':'❌ 已拒绝'}</b>`;
      } else {
        addSub(sub, `${ev.approved?'✅ 已批准':'❌ 已拒绝'}：${ev.tool}`);
      }
      break;

    case 'backfill': {
      const items = ev.items || [];
      const listing = items.map(i =>
        `tool_call_id=${i.tool_call_id}\n${String(i.content).slice(0,600)}`).join('\n────────\n');
      addSub(sub,
        `✅ 回填 <b>${ev.count}</b> 条工具结果（tool_call_id 配对完成，本轮结清）`,
        items.length ? `<b>本轮实际追加进 messages 的每条消息（id + 完整内容）</b>：<pre>${esc(listing)}</pre>`
                     : '（本轮无回填明细数据）');
      break;
    }
    case 'memory_extract':
      addStandalone('memory_extract',
        `🧠 会话结束：记忆提取 → <b>${ev.count}</b> 条候选偏好` + msBadge(ev.ms),
        `<b>输入（本次会话的对话记录全文，交给提取模型）</b>：<pre>${esc(ev.transcript || '（未记录）')}</pre>` +
        `<b>输出（提取出的偏好）</b>：<pre>${esc(JSON.stringify(ev.prefs, null, 1))}</pre>`);
      break;

    case 'final':
      $('budget_text').textContent = ev.max
        ? `${ev.used.toLocaleString()} / ${ev.max.toLocaleString()} tok`
        : `${ev.used.toLocaleString()} tok（不限档）`;
      $('budget_fill').style.width = ev.max
        ? Math.min(100, Math.round(ev.used / ev.max * 100)) + '%'
        : '0%';
      addStandalone('final',
        `🏁 研究完成（${ev.steps} 步 · ${ev.used.toLocaleString()} tok · ${ev.stop_reason}` +
        `${ev.total_ms!=null ? ' · 总耗时 '+(ev.total_ms/1000).toFixed(1)+'s' : ''}）`);
      if (ev.answer) {
        const safe = esc(ev.answer);
        if (typeof marked !== 'undefined') {
          $('report').innerHTML = marked.parse(safe);
          $('report').querySelectorAll('a').forEach(a => a.target = '_blank');
        } else {
          $('report').textContent = safe;
        }
        $('report_panel').style.display = '';
        $('report_panel').scrollIntoView({block:'start'});
      }
      break;
    case 'done':
      if (live) { es.close(); $('start').disabled = false; $('stopbtn').disabled = true; loadHistory(); }
      break;
    case 'error':
      addStandalone('approval', `❌ 运行错误：${esc(ev.message)}`); break;
  }
}

// ---------- 实时运行 ----------
async function start(){
  const q = $('question').value.trim();
  if (!q) { alert('先输入研究问题'); return; }
  if (es) es.close();
  liveMode = true;
  $('start').disabled = true; $('stopbtn').disabled = false;
  resetTimeline();
  $('report_panel').style.display = 'none';
  const r = await fetch('/api/research', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({question:q, tier})});
  const d = await r.json();
  runId = d.run_id;
  listen();
}

function listen(){
  es = new EventSource(`/api/research/${runId}/events`);
  es.onmessage = e => { renderEvent(JSON.parse(e.data), true); };
  es.onerror = () => { es.close(); };
}

// ---------- 历史回放 ----------
async function loadRun(id){
  if (es) es.close();
  liveMode = false;
  runId = id;
  $('start').disabled = false; $('stopbtn').disabled = true;
  resetTimeline();
  const r = await fetch(`/api/runs/${id}/events`);
  const d = await r.json();
  if (!d.events.length) {
    addStandalone('', '该运行没有详细事件记录（早于事件存档功能上线）。');
  } else {
    d.events.forEach(ev => renderEvent(ev, false));
  }
  document.querySelectorAll('.run-item').forEach(el =>
    el.classList.toggle('selrun', el.dataset.rid === id));
}

async function stopRun(){
  if (!runId) return;
  await fetch(`/api/research/${runId}/stop`, {method:'POST'});
}
async function respond(approved){
  await fetch(`/api/research/${runId}/approve`, {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({approved})});
  $('approval').style.display = 'none';
}
</script>
</body>
</html>
